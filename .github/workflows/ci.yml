name: CI

on:
  push:
  pull_request:

jobs:
  full-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Generate platform JSON parity corpus
        run: python scripts/make_parity_corpus.py

      - name: Configure
        run: cmake -S . -B build-cpp -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build-cpp

      - name: Full gate
        run: python scripts/gate.py --require-native
