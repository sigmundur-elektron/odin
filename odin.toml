# --- Agent CLI, e.g. after `odin tools install opencode` -------------------
# [adapters.cli]
# type = "cli-agent"
# command = [".odin/tools/opencode/node_modules/.bin/opencode",
#            "run", "--model", "{model}", "--format", "json"]
# timeout_seconds = 1800


[routing]
# Roles fall back to `default` when unlisted. Point these at real profiles once
# `doctor` has confirmed them; mixing tiers here is how you trade cost against
# capability per stage.
default = "mock"
# analyst     = "frontier"
# reviewer    = "frontier"
# implementer = "coder-32b"
# verifier    = "coder-32b"
# finalizer   = "coder-32b"
