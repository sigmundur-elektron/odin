[harness]
state_dir = ".odin/runs"
max_total_transitions = 40

[git]
# Safe default: produce an explicit staging manifest but do not mutate the index.
stage_on_success = false
timeout_seconds = 300

[gates.quality]
# Projects replace this command. Odin does not prescribe CMake, a test
# framework, a formatter, or an AI framework. Odin's own gate is its native
# test binary.
command = ["ctest", "--test-dir", "build-cpp", "--output-on-failure"]
timeout_seconds = 300


# ---------------------------------------------------------------------------
# Model linkage
#
# Odin bundles no provider and installs nothing on its own. Discover what this
# machine can actually reach:
#
#     odin doctor
#     odin doctor --deep --emit-config
#
# `--emit-config` prints paste-ready blocks for the providers it found, so the
# model ids below are observed rather than guessed. Two adapters cover most of
# the ecosystem:
#
#   openai-compatible     Ollama, LM Studio, llama.cpp, vLLM, LiteLLM,
#                         OpenAI, Azure, OpenRouter, Groq, DeepSeek
#   cli-agent             OpenCode, Claude Code, Aider, Codex, llm
#
# Store credentials with `odin auth set <name>` and reference them by
# name below. Secrets are never written here and never passed on a command line.
# ---------------------------------------------------------------------------

# The deterministic mock is built in, so the checked-in configuration runs a
# complete workflow with no external interpreter or fixture script. It proves
# workflow mechanics and contracts; it is not an implementation model.
[adapters.mock]
type = "mock"

[models.mock]
adapter = "mock"
model = "deterministic-contract-fixture"
parameter_billions = 0
tags = ["test-only"]

# --- Local OpenAI-compatible server (uncomment once `doctor` reports it) ----
