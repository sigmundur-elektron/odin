[harness]
state_dir = ".odin/runs"
max_total_transitions = 40

[git]
# Safe default: produce an explicit staging manifest but do not mutate the index.
stage_on_success = false

[gates.quality]
# Projects replace this command. Odin does not prescribe CMake, a test
# framework, a formatter, or an AI framework.
command = ["python", "-m", "unittest", "discover", "-s", "tests"]
timeout_seconds = 300


# ---------------------------------------------------------------------------
# Model linkage
#
# Odin bundles no provider. Discover what this machine can actually reach:
#
#     python odin.py doctor
#     python odin.py doctor --deep --emit-config
#
# `--emit-config` prints paste-ready blocks for the providers it found, so the
# model ids below are observed rather than guessed. Two adapters cover most of
# the ecosystem:
#
#   adapters/openai_compatible.py  Ollama, LM Studio, llama.cpp, vLLM, LiteLLM,
#                                  OpenAI, Azure, OpenRouter, Groq, DeepSeek
#   adapters/cli_agent.py          OpenCode, Claude Code, Aider, Codex, llm
#
# Credentials are referenced by variable name, never stored here.
# ---------------------------------------------------------------------------

[adapters.mock]
command = ["python", "scripts/mock_agent.py", "--model", "{model}"]
timeout_seconds = 30

[models.mock]
adapter = "mock"
model = "deterministic-contract-fixture"
parameter_billions = 0
tags = ["test-only"]

